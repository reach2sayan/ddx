# The Python bindings.  `uv pip install .` configures this repository's own
# CMakeLists with the extension turned on, so one command builds libddx and the
# module that links it.  Building needs the machine's LLVM 20, as a C++ build
# does; the wheel does not, since libddx carries it.  A release builds that
# wheel per platform under [tool.cibuildwheel] below.
[build-system]
requires = ["scikit-build-core>=1.0", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
# `ddx` on PyPI is an unrelated project; the import name is still `ddx`.
name = "ddx-ad"
dynamic = ["version"]
description = "Reverse-mode automatic differentiation over a runtime graph, compiled through LLVM"
readme = "python/README.md"
license = "BSL-1.0"
# The second is what libddx carries inside the wheel: LLVM, zlib and zstd, and
# pybind11 in the extension.
license-files = ["LICENSE.txt", "THIRD-PARTY-NOTICES.txt"]
authors = [{ name = "Sayan", email = "reach2sayan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.23", "pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/reach2sayan/ddx"
Documentation = "https://github.com/reach2sayan/ddx#readme"
Issues = "https://github.com/reach2sayan/ddx/issues"

[dependency-groups]
# pybind11 is a build dependency above, where the wheel build gets it in an
# isolated environment.  It is here as well because the `python` CMake preset
# builds in-tree against this virtualenv, and asks the interpreter for it.
dev = [
    "pybind11>=3.0",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pybind11-stubgen>=2.5",
]
# The Python half of compare/, wanted only when running the comparison.  scipy
# is here for one function: the `ops` model takes an erf, numpy has none, and
# autograd differentiates scipy's.
compare = [
    "casadi>=3.6",
    "autograd>=1.7",
    "numdifftools>=0.9",
    "scipy>=1.11",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pandas>=2.1",
]
# torch and JAX for the GPU comparison, one build of the pair at a time.
# PyPI's torch is the CUDA build on Linux, so each group takes torch from
# PyTorch's own index; `scripts/compare.py --stack=rocm|cuda|cpu` syncs one.
# The markers are where wheels exist: torch's ROCm build is Linux-only and stops
# at CPython 3.14, its CUDA build has no macOS, and JAX starts at 3.12, its GPU
# plugins on Linux only.  jax[rocm7-local] runs on the system's ROCm 7; torch's
# ROCm wheel carries its own.  triton-rocm is named because it lives only on the
# ROCm index, and a source scoped to a group reaches only what the group lists.
stack-rocm = [
    "torch>=2.10; sys_platform == 'linux' and python_version < '3.15'",
    "triton-rocm; sys_platform == 'linux' and python_version < '3.15'",
    "jax[rocm7-local]>=0.11; sys_platform == 'linux' and python_version >= '3.12' and python_version < '3.15'",
]
stack-cuda = [
    "torch>=2.10; sys_platform != 'darwin'",
    "jax[cuda13]>=0.11; sys_platform == 'linux' and python_version >= '3.12'",
]
stack-cpu = [
    "torch>=2.10",
    "jax>=0.11; python_version >= '3.12'",
]

[tool.uv]
conflicts = [[{ group = "stack-rocm" }, { group = "stack-cuda" }, { group = "stack-cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", group = "stack-rocm" },
    { index = "pytorch-cuda", group = "stack-cuda" },
    { index = "pytorch-cpu", group = "stack-cpu" },
]
triton-rocm = [{ index = "pytorch-rocm", group = "stack-rocm" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.0"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# One version, CMake's: `project(ddx VERSION …)` is where it is written, and a
# release tag is checked against the same line.
[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(ddx VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)'

[tool.scikit-build]
cmake.version = ">=3.26"
cmake.build-type = "Release"
wheel.packages = ["python/ddx"]
# Kept between builds, so an edit to one binding recompiles one file rather than
# reconfiguring LLVM from scratch.
build-dir = "build/wheel/{wheel_tag}"

[tool.scikit-build.cmake.define]
DDX_BUILD_PYTHON = "ON"
DDX_BUILD_JIT = "ON"
# Off rather than AUTO: AUTO would decide by the build machine, and a wheel
# runs on others.  The device backend joins the wheel once CI can test it there.
DDX_BUILD_OPENCL = "OFF"
# A wheel runs on machines other than the one that built it: the x86 baseline
# (AVX2), not the runner's CPU.  Kernels are compiled for the host at run time
# regardless.
ENABLE_NATIVE_ARCH = "OFF"
# python/CMakeLists.txt installs the two shared objects into the package itself;
# the headers and the CMake package are not a wheel's business.
DDX_INSTALL = "OFF"
# Where the Linux presets look too.  A path that does not exist is searched
# past, so another layout loses nothing; `-C cmake.define.LLVM_DIR=...` overrides.
LLVM_DIR = "/usr/lib/llvm-20/lib/cmake/llvm"

# No LLVM archives on Windows yet, so that wheel interprets and ddx.has_jit
# says so.  `inherit`, or this one define is the whole table on Windows: no
# extension module, and the headers installed into the wheel instead.
[[tool.scikit-build.overrides]]
if.platform-system = "win32"
inherit.cmake.define = "append"
cmake.define.DDX_BUILD_JIT = "OFF"

# --- release wheels -----------------------------------------------------------
# One wheel per CPython: pybind11 has no stable-ABI mode, and module.cpp's
# native_enum and array_t are outside the limited API in any case.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux* *-win32 *_i686 cp3??t-*"
build-frontend = "build[uv]"
manylinux-x86_64-image = "manylinux_2_28"
build-verbosity = 1
test-requires = "pytest"
test-command = "pytest -q {package}/python/tests"

# The archives are built in the container -- no package there has them -- and
# scripts/build_llvm.py is idempotent, so a cached .deps skips the hour.  The
# manylinux image's own python3 is too old for the script; one of the builds'
# is not, and before-all runs before any of them is on the PATH.
# CMAKE_PREFIX_PATH rather than LLVM_DIR: the same prefix holds the static zlib
# and zstd LLVMConfig goes looking for.
[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "/opt/python/cp312-cp312/bin/python {project}/scripts/build_llvm.py /project/.deps/llvm-20"
environment = { CMAKE_PREFIX_PATH = "/project/.deps/llvm-20" }

# No macOS section: the tree needs libstdc++'s C++23 ranges, and Homebrew's
# LLVM archives are libc++-built, so there is no toolchain that links both.

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
target-version = "py311"
src = ["python"]
# Generated by pybind11-stubgen from the built module; regenerate it with the
# ddx_python_stubs target rather than editing it to please a linter.
extend-exclude = ["python/ddx/_ddx.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "A", "B", "SIM", "NPY", "RUF", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"python/tests/*" = ["D100", "D103", "ANN201"]
# The comparison models run over four unrelated scalar types -- float, CasADi SX,
# an autograd box and a ddx Expression -- which share no supertype, so `Any` is
# the honest annotation rather than a missing one.  D102 is the Protocol whose
# fourteen method stubs the module docstring already describes.
"compare/python/*" = ["ANN401", "D102"]

[tool.mypy]
files = ["python/ddx", "python/tests"]
strict = true
mypy_path = "python"
# Field(default, ge=...) is a default; without this every Options() looks like it
# is missing ten arguments.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Generated by pybind11-stubgen and used for its types, not audited for style:
# the enums it writes have no members mypy recognises and its dunders carry no
# annotations.  Regenerate with the ddx_python_stubs target.
module = ["ddx._ddx"]
ignore_errors = true
