# Wheels, an sdist and a native NuGet package, attached to a GitHub Release.
# A tag `vX.Y.Z` builds and publishes -- pushed by hand, or cut on Mondays by
# weekly-release.yml; a manual run on a branch builds the same artifacts and
# publishes nothing, which is how a change to the pipeline is tried before a
# version rides on it.  The NuGet package also goes to nuget.org by trusted
# publishing when the NUGET_USER repository variable names the nuget.org
# profile; without it the .nupkg rides the GitHub Release alone.
#
# Linux wheels carry the JIT: LLVM is built as archives inside the manylinux
# container by scripts/build_llvm.py, once, and cached under .deps -- the
# checkout is what cibuildwheel mounts at /project, so a cache on the host is
# what the container's before-all finds.  Windows builds without the JIT
# (pyproject.toml's override) and says so through ddx.has_jit.  No macOS
# wheel: the tree is written to libstdc++ 14's C++23, and libc++ -- the only
# standard library Homebrew's LLVM archives can be linked with -- has no
# views::enumerate, cartesian_product, chunk, stride or ranges::fold.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # First and cheap: a tag that does not name the CMake version stops here,
  # before an hour of wheels is spent on the wrong number.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: |
          version=$(sed -nE 's/^project\(ddx VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not name CMakeLists.txt's version $version"
            exit 1
          fi

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # The script is the key: a change to what it builds is a new prefix.
      # Restore and save separately: before-all builds LLVM inside the
      # cibuildwheel step, and a wheel failing after it must not cost the
      # archives -- the save below runs either way.
      - name: Restore LLVM archives (Linux)
        if: runner.os == 'Linux'
        id: llvm
        uses: actions/cache/restore@v4
        with:
          path: .deps/llvm-20
          key: llvm-manylinux_2_28-x86_64-${{ hashFiles('scripts/build_llvm.py') }}

      # build[uv] wants a uv of its own on the two hosts that build outside a
      # container; the Linux container brings one.
      - name: Install uv
        if: runner.os != 'Linux'
        run: pipx install uv

      # A full version: cibuildwheel publishes no floating major tag.
      - uses: pypa/cibuildwheel@v3.4.1

      # Only a prefix that reached its LLVMConfig: a key can be written once,
      # and a partial build saved under it would be restored as if whole.
      - name: Save LLVM archives (Linux)
        if: always() && runner.os == 'Linux' && steps.llvm.outputs.cache-hit != 'true'
            && hashFiles('.deps/llvm-20/lib/cmake/llvm/LLVMConfig.cmake') != ''
        uses: actions/cache/save@v4
        with:
          path: .deps/llvm-20
          key: ${{ steps.llvm.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx install uv
      - run: uv build --sdist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  # The native package for MSVC consumers: headers plus ddx.dll/ddx.lib, x64,
  # Release and Debug from one configure of the multi-config generator.  STL
  # types cross the DLL boundary, so a /MDd consumer needs the Debug flavour.
  nuget:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DDDX_BUILD_TESTS=OFF

      - name: Build and install both configs
        run: |
          cmake --build build --config Release
          cmake --build build --config Debug
          cmake --install build --config Release --prefix prefix-release
          cmake --install build --config Debug --prefix prefix-debug

      - name: Pack
        run: |
          python scripts/pack_nuget.py --release prefix-release --debug prefix-debug --stage stage
          nuget pack contrib/nuget/ddx.nuspec -Version ${{ needs.version.outputs.version }} -BasePath stage -OutputDirectory nupkg -NonInteractive

      - uses: actions/upload-artifact@v6
        with:
          name: nuget
          path: nupkg/*.nupkg

  # The overlay port under contrib/vcpkg pins a tag and its archive hash; each
  # release rewrites the pin on main, pushed with the same deploy key the
  # weekly bump uses (main requires PRs; deploy keys bypass that ruleset).
  vcpkg-port:
    if: github.ref_type == 'tag'
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - run: |
          version="${{ needs.version.outputs.version }}"
          sha=$(curl -sfL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/v$version.tar.gz" | sha512sum | cut -d' ' -f1)
          sed -i -E "s/\"version\": \"[0-9.]+\"/\"version\": \"$version\"/" contrib/vcpkg/ports/ddx/vcpkg.json
          sed -i -E "s/SHA512 [0-9a-f]+/SHA512 $sha/" contrib/vcpkg/ports/ddx/portfile.cmake
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "vcpkg port v$version"
          git push origin HEAD:main

  release:
    if: github.ref_type == 'tag'
    needs: [version, wheels, sdist, nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

      # Trusted publishing: the job's OIDC token buys a one-hour single-use
      # API key against the policy registered on nuget.org (owner reach2sayan,
      # repo ddx, workflow release.yml).  A variable rather than a secret so
      # the steps can be skipped where it is unset -- a fork, or an account
      # not yet configured -- and the .nupkg rides the GitHub release alone.
      - name: NuGet login
        if: vars.NUGET_USER != ''
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: vars.NUGET_USER != ''
        run: dotnet nuget push dist/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  # PyPI as ddx-ad, by trusted publishing against the publisher registered on
  # pypi.org (repo ddx, workflow release.yml, environment pypi).  After the
  # GitHub release, since a version once on PyPI can never be uploaded again.
  # Wheels only: the sdist builds the JIT, so a platform without a wheel would
  # fail in CMake for want of LLVM 20 instead of finding no distribution.
  pypi:
    if: github.ref_type == 'tag'
    needs: [version, release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ddx-ad/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
