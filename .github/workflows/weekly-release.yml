# Every Monday, main becomes a release: the patch number in project() goes up
# by one, the bump is committed and tagged, and Release builds and publishes
# the wheels for that tag.  A week in which main did not move produces nothing
# -- the test is whether anything but the vcpkg port pin, which each release
# rewrites on top of its own tag, differs from the latest tag -- and a red
# main is never released: the three compiler workflows must have passed on
# HEAD.  "Run workflow" is the same thing on demand.
#
# The bump is pushed over SSH with the release-agent deploy key
# (RELEASE_DEPLOY_KEY holds the private half): main is ruled "changes must be
# made through a pull request", and deploy keys sit on that ruleset's bypass
# list.  A deploy-key push also fires Release's tag trigger, which a push
# made with the workflow's own token could not do.
#
# Minor and major bumps are written into project() by hand and tagged as
# before; the next Monday finds nothing new past the tag and does nothing.
name: Weekly release

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Anything since the last tag?
        id: since
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*')
          if git diff --quiet "$last" HEAD -- . ':!contrib/vcpkg/ports'; then
            echo "main is still $last; nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Is main green?
        if: steps.since.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in "GCC 14" "Clang 20" "MSVC 2022"; do
            c=$(gh run list --workflow "$wf" --commit "$GITHUB_SHA" --branch main \
                  --json conclusion --jq '.[0].conclusion')
            [[ "$c" == success ]] || { echo "::error::$wf on $GITHUB_SHA: ${c:-no run}"; exit 1; }
          done

      - name: Bump, commit, tag, push
        if: steps.since.outputs.skip != 'true'
        run: |
          cur=$(sed -nE 's/^project\(ddx VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          new="${cur%.*}.$(( ${cur##*.} + 1 ))"
          sed -i -E "s/^(project\(ddx VERSION )$cur\b/\1$new/" CMakeLists.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $new"
          git tag -a "v$new" -m "Release $new"
          git push --follow-tags origin HEAD:main
