# The build every compiler runs.  Called only: the three per-compiler workflows
# beside this one exist so each gets its own badge, and a badge names a
# workflow, never a job within one.
#
# Three jobs.  `build` is the library as a default configure makes it, no JIT,
# with the Python module on top, on every OS.  `jit` is the other half --
# libddx with LLVM inside, the JIT tests, and the module against it -- and
# runs where the LLVM archives can be had: Linux, from scripts/build_llvm.py,
# an hour once and then a cache.  `opencl` is the device backend against pocl,
# a CPU runtime with double precision, so every device test runs on a runner
# with no GPU; it builds no LLVM, which also proves an OpenCL-only libddx.
name: Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      c_compiler:
        required: true
        type: string
      cpp_compiler:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: Release

jobs:
  build:
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v5

      # The documented floor rather than a version above it, so what README.md
      # promises is what CI proves.  g++-14 for the libstdc++ 14 floor
      # (std::ranges::to), which clang on Linux compiles against too, so the
      # line serves either Linux caller.  clang-20 for the Clang floor README.md
      # documents.  Compilers only: Boost is fetched at a pinned hash and never found, and
      # an installed ddx carries the headers in its own prefix, so tests/package
      # needs none either.
      - name: Install compilers (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-20 gcc-14 g++-14

      # include/ may name the standard library and Boost, and nothing else.
      # Boost is not a third party here: it is fetched at a pinned hash and
      # installed into ddx's own prefix, so it is as present as <vector> and a
      # header should reach for the right library rather than the allowed one.
      # The vendored mdspan is the one genuine exception.
      #
      # What still holds: a quoted include resolves inside include/, and the
      # core must not depend on rt/ in either direction.
      - name: Header dependencies stay declared
        if: runner.os == 'Linux'
        shell: bash
        run: |
          angled=$(grep -rnE '#[[:space:]]*include[[:space:]]*<[^>]*/' include --include='*.hpp' \
                   | grep -v third_party | grep -v '<boost/' || true)
          # A quoted include is one of ours and must resolve inside include/,
          # as a header or as the .in template CMake configures into the build
          # tree; one that does not is a bundled dependency under another spelling.
          quoted=$( { grep -rnE '#[[:space:]]*include[[:space:]]*"' include --include='*.hpp' \
                       | grep -v third_party || true; } \
                   | while IFS=: read -r f n rest; do
                       h=${rest#*\"}; h=${h%%\"*}
                       [ -e "$(dirname "$f")/$h" ] || [ -e "include/$h" ] || [ -e "include/$h.in" ] \
                         || echo "$f:$n: $h"
                     done)
          # The core must never reach into rt/.
          core=$(grep -rnE '#[[:space:]]*include[[:space:]]*"rt/' include --include='*.hpp' \
                 | grep -v '^include/rt/' || true)
          if [ -n "$angled$quoted$core" ]; then
            echo "a third-party header leaked into include/:"
            [ -n "$angled" ] && echo "$angled"
            [ -n "$quoted" ] && echo "$quoted"
            [ -n "$core" ] && echo "the core must not depend on rt/:" && echo "$core"
            exit 1
          fi
          echo "include/ depends on the standard library and Boost only"

      - name: Set build directory
        id: strings
        shell: bash
        run: echo "build-dir=${GITHUB_WORKSPACE}/build" >> "$GITHUB_OUTPUT"

      # The extension builds against an interpreter that has pybind11 -- the
      # same .venv the `python` presets ask for, with what the dev group names.
      - name: Python environment
        shell: bash
        run: |
          pipx install uv
          uv sync --group dev --no-install-project

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B ${{ steps.strings.outputs.build-dir }}
          -DCMAKE_CXX_COMPILER=${{ inputs.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ inputs.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
          -DDDX_BUILD_PYTHON=ON
          -DPython_ROOT_DIR=${{ github.workspace }}/.venv
          -DPython_FIND_VIRTUALENV=ONLY
          -S ${{ github.workspace }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B "${{ steps.strings.outputs.build-dir }}"
          -DCMAKE_CXX_COMPILER=${{ inputs.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ inputs.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
          -DDDX_BUILD_PYTHON=ON
          -DPython_ROOT_DIR="${{ github.workspace }}/.venv"
          -DPython_FIND_VIRTUALENV=ONLY
          -S "${{ github.workspace }}"

      # The Boost subset an installed ddx ships is a checked-in list, and a public
      # header that names a new Boost library silently installs short without
      # this.  Run after configuring, which is what fetches the Boost tree to
      # read.  Linux only -- the answer is the same on every toolchain, because
      # the list is directories, the per-compiler variants are siblings inside
      # them, and the libraries that hide a variant in a subdirectory instead
      # go in whole.
      - name: Installed Boost list is current
        if: runner.os == 'Linux'
        run: python3 scripts/boost_headers.py --check --cxx ${{ inputs.cpp_compiler }}

      - name: Build
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ inputs.build_type }}

      - name: Build tests
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ inputs.build_type }} --target tests

      # python.pytest is among these: the module is configured on.
      - name: Test
        working-directory: ${{ steps.strings.outputs.build-dir }}
        run: ctest --build-config ${{ inputs.build_type }} --output-on-failure

  jit:
    if: startsWith(inputs.os, 'ubuntu')
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install compilers (Ubuntu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-20 gcc-14 g++-14

      # Its own key, not the release workflow's: a prefix built here carries
      # this runner's glibc, which a manylinux wheel must never link.
      # Restored and saved as two steps rather than one actions/cache: that one
      # saves when the job ends, and only if it passed, so a ddx build that
      # fails throws an hour of LLVM away.  Saved here, the archives outlive
      # whatever the build does with them.
      - name: Restore LLVM archives
        id: llvm
        uses: actions/cache/restore@v4
        with:
          path: .deps/llvm-20
          key: llvm-${{ inputs.os }}-x86_64-${{ hashFiles('scripts/build_llvm.py') }}

      - name: LLVM archives
        run: python3 scripts/build_llvm.py .deps/llvm-20

      - name: Save LLVM archives
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/llvm-20
          key: ${{ steps.llvm.outputs.cache-primary-key }}

      # The extension builds against an interpreter that has pybind11 -- the
      # same .venv the `python` preset asks for, with what the dev group names.
      - name: Python environment
        run: |
          pipx install uv
          uv sync --group dev --no-install-project

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_CXX_COMPILER=${{ inputs.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ inputs.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
          -DDDX_BUILD_JIT=ON
          -DDDX_BUILD_PYTHON=ON
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/.deps/llvm-20
          -DPython_ROOT_DIR=${{ github.workspace }}/.venv
          -DPython_FIND_VIRTUALENV=ONLY
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --config ${{ inputs.build_type }}

      - name: Build tests
        run: cmake --build "${{ github.workspace }}/build" --config ${{ inputs.build_type }} --target tests

      # jit.* and python.pytest ride along: the JIT is configured on, so ctest
      # has them.
      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest --build-config ${{ inputs.build_type }} --output-on-failure

  opencl:
    if: startsWith(inputs.os, 'ubuntu')
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v5

      # pocl is the runtime the tests run on; the headers and the loader are
      # fetched at a pinned hash like Boost, so nothing else is installed.
      - name: Install compilers and pocl
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-20 gcc-14 g++-14 pocl-opencl-icd

      - name: Python environment
        run: |
          pipx install uv
          uv sync --group dev --no-install-project

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_CXX_COMPILER=${{ inputs.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ inputs.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ inputs.build_type }}
          -DDDX_BUILD_OPENCL=ON
          -DDDX_BUILD_PYTHON=ON
          -DPython_ROOT_DIR=${{ github.workspace }}/.venv
          -DPython_FIND_VIRTUALENV=ONLY
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --config ${{ inputs.build_type }}

      - name: Build tests
        run: cmake --build "${{ github.workspace }}/build" --config ${{ inputs.build_type }} --target tests

      # By name, so a runner that ever gains another runtime still tests pocl.
      - name: Test
        working-directory: ${{ github.workspace }}/build
        env:
          DDX_TEST_DEVICE: Portable
        run: ctest --build-config ${{ inputs.build_type }} --output-on-failure
