# The build every compiler runs, called by the per-compiler workflows (one badge
# each).  `conan build .` configures, builds and tests the library, the Python
# module and the test suite, with the JIT and without.  Conan supplies LLVM
# only (contrib/conan); Boost is left to CMake, fetched as for any user.
name: Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      c_compiler:
        required: true
        type: string
      cpp_compiler:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: Release

jobs:
  build:
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        jit: [ "False", "True" ]
    name: build (jit=${{ matrix.jit }})
    defaults:
      run:
        shell: bash
    env:
      # FindPython takes the interpreter that has pybind11 from here.
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      CONAN_OPTIONS: >-
        -pr:a contrib/conan/profile -s:a build_type=${{ inputs.build_type }}
        -o &:jit=${{ matrix.jit }} -o &:boost=False -o &:tests=True -o &:python=True
        --build=missing

    steps:
      - uses: actions/checkout@v5

      # The documented floors: g++-14 (libstdc++ 14, which clang compiles
      # against too) and clang-20.  Eigen and OpenBLAS feed tests_eigen and
      # tests_cblas, built only where found.
      - name: Install compilers (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-20 gcc-14 g++-14 libeigen3-dev libopenblas-dev

      # include/ names the standard library and Boost, and nothing else but the
      # vendored mdspan; the core reaches rt/ only through Equation's lowering.
      - name: Header dependencies stay declared
        if: runner.os == 'Linux' && matrix.jit == 'False'
        run: |
          angled=$(grep -rnE '#[[:space:]]*include[[:space:]]*<[^>]*/' include --include='*.hpp' \
                   | grep -v third_party | grep -v '<boost/' || true)
          quoted=$( { grep -rnE '#[[:space:]]*include[[:space:]]*"' include --include='*.hpp' \
                       | grep -v third_party || true; } \
                   | while IFS=: read -r f n rest; do
                       h=${rest#*\"}; h=${h%%\"*}
                       [ -e "$(dirname "$f")/$h" ] || [ -e "include/$h" ] || [ -e "include/$h.in" ] \
                         || echo "$f:$n: $h"
                     done)
          core=$(grep -rnE '#[[:space:]]*include[[:space:]]*"rt/' include --include='*.hpp' \
                 | grep -v '^include/rt/' \
                 | grep -vE '^include/symbolic/equation\.hpp:[0-9]+:#include "rt/(bridge|derivative|interpret)\.hpp"' \
                 || true)
          if [ -n "$angled$quoted$core" ]; then
            echo "a third-party header leaked into include/:"
            [ -n "$angled" ] && echo "$angled"
            [ -n "$quoted" ] && echo "$quoted"
            [ -n "$core" ] && echo "the core reaches into rt/ beyond Equation's lowering:" && echo "$core"
            exit 1
          fi
          echo "include/ depends on the standard library and Boost only"

      - name: Python and Conan
        run: |
          pipx install uv
          pipx install conan
          uv sync --group dev --no-install-project

      # Windows: a short CONAN_HOME keeps LLVM's build tree under MAX_PATH, and
      # cl is what detect finds without CC/CXX.
      - name: Conan profile
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            echo "CONAN_HOME=C:\\c" >> "$GITHUB_ENV"
            export CONAN_HOME='C:\c'
          else
            echo "CC=${{ inputs.c_compiler }}" >> "$GITHUB_ENV"
            echo "CXX=${{ inputs.cpp_compiler }}" >> "$GITHUB_ENV"
            export CC=${{ inputs.c_compiler }} CXX=${{ inputs.cpp_compiler }}
          fi
          conan profile detect
          conan remote add ddx contrib/conan --type=local-recipes-index

      # Restored and saved as two steps: a failing ddx build must not throw away
      # an hour of LLVM.
      - name: Restore Conan packages
        if: matrix.jit == 'True'
        id: conan
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.os == 'Windows' && 'C:\c\p' || '~/.conan2/p' }}
          key: conan-${{ inputs.os }}-${{ inputs.cpp_compiler }}-${{ inputs.build_type }}-${{ hashFiles('contrib/conan/**', 'conanfile.py') }}

      - name: Conan dependencies
        if: matrix.jit == 'True'
        run: conan install . $CONAN_OPTIONS

      - name: Save Conan packages
        if: matrix.jit == 'True' && steps.conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.os == 'Windows' && 'C:\c\p' || '~/.conan2/p' }}
          key: ${{ steps.conan.outputs.cache-primary-key }}

      - name: Build and test
        run: conan build . $CONAN_OPTIONS

      # The Boost subset an installed ddx ships is a checked-in list; configuring
      # fetched the tree it is checked against.
      - name: Installed Boost list is current
        if: runner.os == 'Linux' && matrix.jit == 'False'
        run: python3 scripts/boost_headers.py --check --cxx ${{ inputs.cpp_compiler }}
